# Casimir's public CI (CAS 011 rule 6): everything that needs nothing private. The developer tests read answers back
# through the calculator firmware's core, which is private, so they run where its clone is (make test; README.md).
# On pushes to main and on pull requests only. No secrets.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  make:
    name: make check (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/intel-dfp/IntelRDFPMathLib20U5.tar.gz
          key: intel-dfp-85dafd70f0fe2a8da218ade4233fca9d3228b0b04cd6d8527f7499926be01037
      - run: ${{ matrix.cc }} --version | head -1
      # the library, CLI and example at -Werror; the golden corpus; the frame and symbol gates; the small-primes
      # gcd check; check-abn (the recorded SHA-256s) and its planted-byte control; docs/language.md's examples
      - run: make check

  cmake:
    name: cmake (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cmake -j4
      - run: ctest --test-dir build-cmake --output-on-failure

  wasm:
    name: wasm (emscripten 4.0.10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the module and its JavaScript wrapper, then the golden corpus through them under node, with its control
      - run: scripts/wasm.sh

  esp-idf:
    name: ESP-IDF component (5.4.2, ESP32-S3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the S3 bench, built on the component in Espressif's image; no chip here (scripts/device.sh runs it on one)
      - run: scripts/device.sh --build
